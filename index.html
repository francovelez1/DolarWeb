<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DolarWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background:#0a1a2f;
  color:#e5e7eb;
}

header {
  padding:20px;
}

h1 {
  margin:0;
}

.subtitle {
  font-family:'Playfair Display', serif;
  font-size:14px;
  opacity:0.7;
}

.container {
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:#112b4a;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

.rates-bar {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.rate {
  flex:1;
  min-width:120px;
  background:#1d4ed8;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

input, select, button {
  padding:10px;
  border-radius:10px;
  border:none;
  margin:5px;
}

button {
  background:#22c55e;
  cursor:pointer;
}

.history-item {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.news p {
  font-size:14px;
  margin:6px 0;
}
</style>
</head>
<body>

<header>
  <h1>DolarWeb 💵</h1>
  <div class="subtitle">Cotización Real en Argentina</div>
</header>

<div class="container">

<div class="card">
  <div class="rates-bar" id="rates"></div>
</div>

<div class="grid">

<div class="card">
  <h3>Calculadora</h3>
  <input type="number" id="amount" placeholder="ARS">
  <select id="type"></select>
  <button onclick="convert()">Convertir</button>
  <p id="result"></p>
</div>

<div class="card">
  <h3>Dólar Blue en tiempo real</h3>
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>Noticias</h3>
  <div class="news" id="news"></div>
</div>

</div>

</div>

<script>
let ratesData = [];

async function fetchRates() {
  const res = await fetch('https://dolarapi.com/v1/dolares');
  const data = await res.json();
  ratesData = data;

  const container = document.getElementById('rates');
  const select = document.getElementById('type');

  container.innerHTML = '';
  select.innerHTML = '';

  const filtered = data.filter(d => 
    ['Blue','Bolsa','Euro','Real','Peso Chileno'].includes(d.nombre)
  );

  filtered.forEach(d => {
    const div = document.createElement('div');
    div.className = 'rate';
    div.innerHTML = `<strong>${d.nombre}</strong><br>$${d.venta}`;
    container.appendChild(div);

    const opt = document.createElement('option');
    opt.value = d.venta;
    opt.text = d.nombre;
    select.appendChild(opt);
  });
}

function convert() {
  const amount = document.getElementById('amount').value;
  const rate = document.getElementById('type').value;
  document.getElementById('result').innerText = `USD ${(amount / rate).toFixed(2)}`;
}

async function fetchHistory() {
  const res = await fetch('https://api.bluelytics.com.ar/v2/evolution.json');
  const data = await res.json();

  const lastDays = data.slice(-7);

  new Chart(document.getElementById('chart'), {
    type:'line',
    data:{
      labels:lastDays.map(d=>d.date),
      datasets:[{
        data:lastDays.map(d=>d.value_sell),
        borderWidth:2
      }]
    }
  });
}

function loadNews() {
  const news = [
    'Sube el dólar blue esta semana',
    'Movimientos en el MEP',
    'Expectativa económica en Argentina'
  ];

  document.getElementById('news').innerHTML = news.map(n=>`<p>• ${n}</p>`).join('');
}

fetchRates();
fetchHistory();
loadNews();
</script>

</body>
</html>
