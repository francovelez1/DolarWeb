<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolar Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: rgba(255,255,255,0.05);
      --glass: rgba(255,255,255,0.08);
      --accent: #22c55e;
      --text: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827);
      color: var(--text);
      margin: 0;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    header p {
      margin: 5px 0 0;
      opacity: 0.7;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .rates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    .rate {
      background: var(--glass);
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      transition: 0.2s;
    }

    .rate strong {
      display: block;
      margin-bottom: 5px;
    }

    .rate:hover {
      transform: translateY(-3px);
    }

    .calculator {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--glass);
      color: var(--text);
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    #result {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 600;
    }

    canvas {
      margin-top: 10px;
    }

    .news p {
      font-size: 14px;
      opacity: 0.8;
      margin: 6px 0;
    }

    footer {
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
      padding: 20px;
    }

  </style>
</head>
<body>

<header>
  <h1>💵 Dolar Pro</h1>
  <p>Cotizaciones en tiempo real en Argentina</p>
</header>

<div class="container">

  <div class="card">
    <h3>Cotizaciones</h3>
    <div class="rates" id="rates"></div>
  </div>

  <div class="card">
    <h3>Calculadora</h3>
    <div class="calculator">
      <input type="number" id="amount" placeholder="Monto en ARS">
      <select id="type"></select>
      <button onclick="convert()">Convertir</button>
    </div>
    <div id="result"></div>
  </div>

  <div class="card">
    <h3>Histórico</h3>

<select id="historyType" onchange="fetchHistoryReal()">
  <option value="blue">Blue</option>
  <option value="oficial">Oficial</option>
  <option value="mep">MEP</option>
</select>

<canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h3>Resumen rápido</h3>
    <div class="news" id="news"></div>
  </div>

</div>

<footer>
  Hecho simple. Rápido. Útil.
</footer>

<script>
let ratesData = [];

async function fetchRates() {
  const res = await fetch('https://dolarapi.com/v1/dolares');
  const data = await res.json();
  ratesData = data;

  const container = document.getElementById('rates');
  const select = document.getElementById('type');

  container.innerHTML = '';
  select.innerHTML = '';

  data.slice(0,6).forEach(d => {
    const div = document.createElement('div');
    div.className = 'rate';
    div.innerHTML = `<strong>${d.nombre}</strong>$${d.venta}`;
    container.appendChild(div);

    const opt = document.createElement('option');
    opt.value = d.venta;
    opt.text = d.nombre;
    select.appendChild(opt);
  });
}

function convert() {
  const amount = document.getElementById('amount').value;
  const rate = document.getElementById('type').value;
  const result = amount / rate;
  document.getElementById('result').innerText = `USD ${result.toFixed(2)}`;
}

let chart;

function updateChart(labels, values) {
  const ctx = document.getElementById('chart');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Dólar Blue',
        data: values,
        borderWidth: 2,
        tension: 0.3
      }]
    }
  });
}
lastDays.forEach((d, index) => {
  const div = document.createElement('div');
  div.className = 'history-item';

  const dateObj = new Date(d.date);
  const date = dateObj.toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });

  // detectar hoy
  const today = new Date().toDateString();
  const isToday = dateObj.toDateString() === today;

  // comparar con día anterior
  const prev = index > 0 ? lastDays[index - 1].value_sell : null;
  const diff = prev ? d.value_sell - prev : 0;

  // estilo dinámico
  div.style.fontWeight = isToday ? '600' : '400';
  div.style.color = isToday ? '#22c55e' : 'white';

  div.innerHTML = `
    <span>${date}</span>
    <span>$${d.value_sell} ${diff > 0 ? '📈' : diff < 0 ? '📉' : ''}</span>
  `;

  container.appendChild(div);
});
function loadNews() {
  const news = [
    'Dólar en leve alza',
    'Mercado atento a inflación',
    'Movimientos en el MEP'
  ];

  document.getElementById('news').innerHTML = news.map(n => `<p>• ${n}</p>`).join('');
}

fetchRates();
fetchHistoryReal();
loadNews();
</script>

</body>
</html>
